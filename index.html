<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>AnimeGarden - Accueil</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
    }
    header {
      background-image: url('https://wallpapers.com/images/featured/anime-aesthetic-9iqz4lyby1k1h5ck.jpg');
      background-size: cover;
      background-position: center;
      height: 300px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-shadow: 1px 1px 4px #000;
    }
    header h1 {
      font-size: 3rem;
      margin: 0;
    }
    header p {
      font-size: 1.2rem;
      margin-top: 10px;
    }
    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }
    section {
      margin-bottom: 40px;
    }
    h2 {
      border-bottom: 3px solid #00b894;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 180px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .card h3 {
      margin: 10px;
      font-size: 1.1rem;
    }
    .card p {
      margin: 0 10px 10px 10px;
      font-size: 0.9rem;
      color: #555;
      flex-grow: 1;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #2d3436;
      color: white;
    }
  </style>
</head>
<body>

<header>
  <h1>AnimeGarden</h1>
  <p>Le jardin des animés et mangas à découvrir !</p>
</header>

<main>
  <section>
    <h2>🌟 Animés Recommandés</h2>
    <div id="recommended" class="cards">
      <!-- Animés recommandés ici -->
    </div>
  </section>

  <section>
    <h2>📺 Animés du moment</h2>
    <div id="current" class="cards">
      <!-- Animés du moment ici -->
    </div>
  </section>
</main>

<footer>
  <p>© 2025 AnimeGarden. Site de passionné d'animé et manga.</p>
</footer>

<!-- JS pour récupérer les animés via l'API Jikan -->
<script>
async function fetchAnime(url, containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = 'Chargement...';

  try {
    const response = await fetch(url);
    const data = await response.json();

    container.innerHTML = ''; // Clear loading

    const animes = data.data.slice(0, 8); // Prendre 8 animés max

    animes.forEach(anime => {
      const card = document.createElement('div');
      card.classList.add('card');

      card.innerHTML = `
        <img src="${anime.images.webp.large_image_url}" alt="${anime.title}" />
        <h3>${anime.title}</h3>
        <p>${anime.synopsis ? anime.synopsis.substring(0, 100) + '...' : 'Pas de description'}</p>
      `;

      container.appendChild(card);
    });
  } catch (error) {
    container.innerHTML = 'Erreur de chargement.';
    console.error(error);
  }
}

// URL Jikan API pour animés recommandés (top animés)
const recommendedUrl = 'https://api.jikan.moe/v4/top/anime';

// URL Jikan API pour animés du moment (saison actuelle)
const currentSeasonUrl = 'https://api.jikan.moe/v4/seasons/now';

// Charger les deux sections au chargement
fetchAnime(recommendedUrl, 'recommended');
fetchAnime(currentSeasonUrl, 'current');
</script>

</body>
</html>
